# Local single-node kind cluster for P11 parity testing. The control-plane node
# is labelled ingress-ready and maps host 8088->container 80 so an optional
# ingress-nginx (see deploy/README.md) is reachable at http://localhost:8088.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: statusflow
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
