# Scrape the StatusFlow api + worker /metrics on their `ops` port. The api and
# worker Services (deploy/charts/statusflow/templates/{api,worker}-service.yaml)
# already expose a named `ops` port for exactly this. Lives in `monitoring` but
# selects Services in `statusflow` via namespaceSelector; Prometheus adopts it
# through the open selectors in values-kube-prometheus-stack.yaml (the `release`
# label is belt-and-suspenders for the default release-scoped selector).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: statusflow
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: statusflow
spec:
  # Both Services share app.kubernetes.io/name=statusflow, so drive the `job`
  # label off the component label instead -> job="api" / job="worker".
  jobLabel: app.kubernetes.io/component
  namespaceSelector:
    matchNames:
      - statusflow
  selector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: [statusflow]
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker]
  endpoints:
    - port: ops
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
