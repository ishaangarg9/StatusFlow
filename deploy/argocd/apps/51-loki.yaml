# Wave 2: Loki (single-binary log store). Grafana reads it via the Loki
# datasource wired in values-kube-prometheus-stack.yaml; promtail (app 52) feeds
# it. Multi-source: pinned grafana chart + this repo's values via $values.
# Replace <you>.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: statusflow
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.1.0
      helm:
        valueFiles:
          - $values/deploy/observability/values-loki.yaml
    - repoURL: https://github.com/<you>/SaaS.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
