# Wave -1: the SealedSecret resources. Argo applies the encrypted SealedSecrets
# from Git; the in-cluster sealed-secrets controller (a day-0 bootstrap, see
# README) decrypts them into the real Secrets that Postgres + StatusFlow consume.
#
# Why the controller itself is NOT an Argo app: it holds the decryption private
# key and is the trust anchor that has to exist BEFORE any secret can be unsealed
# — bootstrapping it is a chicken-and-egg better solved once, by hand, with its
# key backed up offline (deploy/sealed-secrets/install.sh). Argo manages the
# sealed *payloads* (drift-controlled in Git); the controller stays out of band.
#
# Replace <you>.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: statusflow
  source:
    repoURL: https://github.com/<you>/SaaS.git
    targetRevision: main
    path: deploy/sealed-secrets/sealed
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: statusflow     # default ns; each SealedSecret carries its own
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # statusflow + cloudflared namespaces are day-0
