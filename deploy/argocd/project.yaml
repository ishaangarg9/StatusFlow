# AppProject for the StatusFlow platform. Scoping the project (not running
# everything in `default`) is the GitOps least-privilege story: Applications may
# only pull from THIS repo and may only deploy into the namespaces we name.
#
# Replace <you> with your GitHub user/org. Keep this in lockstep with the repo
# URL used by root-app.yaml and apps/*.yaml.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: statusflow
  namespace: argocd
  # Keep the project around even if the app-of-apps is deleted.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: StatusFlow SaaS + its platform addons (single-node k3s).
  sourceRepos:
    - https://github.com/<you>/SaaS.git
    # P14 observability charts (kube-prometheus-stack, loki, promtail,
    # prometheus-postgres-exporter). Argo treats a Helm chart repo as a source.
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: statusflow
    - server: https://kubernetes.default.svc
      namespace: cloudflared
    - server: https://kubernetes.default.svc
      namespace: argocd          # the root app-of-apps lives here
    - server: https://kubernetes.default.svc
      namespace: monitoring      # P14: Prometheus/Grafana/Loki
  # The app charts need no cluster-scoped resources (their NetworkPolicies, the
  # migration Job, and Postgres init are all namespaced). P14's
  # kube-prometheus-stack does: the Prometheus-Operator CRDs, its cluster RBAC,
  # and its admission webhooks. Allow exactly those kinds; deny everything else,
  # keeping the least-privilege GitOps story.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  # Roles/SSO can be added later; for a single-operator portfolio the default
  # admin + Cloudflare Access in front of the UI is the access boundary.
