# The app-of-apps root. This is the ONLY Application you apply by hand; it points
# at deploy/argocd/apps/ and Argo CD then manages every child Application found
# there (Postgres, StatusFlow, sealed-secret resources, cloudflared). Add a new
# platform component by committing a new file under apps/ — no kubectl needed.
#
# targetRevision tracks `main`: .github/workflows/images.yml commits the image
# tag bump there after CI passes, which is what rolls a release out.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: statusflow
  source:
    repoURL: https://github.com/ishaangarg9/StatusFlow.git
    targetRevision: main
    path: deploy/argocd/apps
    directory:
      recurse: false
      # Only the child Application manifests live directly under apps/. The live
      # box (shared 8 GiB Hostinger VPS, Caddy edge) runs the app tier only:
      # 10 secrets, 20 postgres, 30 statusflow. 40 (cloudflared) is the Tunnel
      # edge, unused behind Caddy; 50-54 (observability) don't fit the RAM
      # budget alongside n8n. To enable them later widen this glob, e.g.
      # "{10,20,30,5?}-*.yaml" — a removed app is pruned by Argo, so narrowing
      # it again tears the stack down cleanly.
      include: "{10,20,30}-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true       # a child Application removed from Git is removed from the cluster
      selfHeal: true    # drift (manual kubectl edits) is reverted to Git
    syncOptions:
      - CreateNamespace=false   # namespaces are day-0 bootstrap (see README)
