# StatusFlow — production overrides for the postgres chart (k3s on the VPS).
# Argo CD applies this with releaseName "pg" (deploy/argocd/apps/20-postgres.yaml).
#   helm install pg ./deploy/charts/postgres -n statusflow -f deploy/prod/values-postgres.yaml
# Release name "pg" => Service "pg-postgres" (matches values-statusflow.yaml db.host).

auth:
  # Passwords come from the Sealed Secret (deploy/sealed-secrets), never inline.
  create: false
  existingSecret: statusflow-pg-auth   # keys: superuser-password, app-user-password

persistence:
  enabled: true
  size: 20Gi
  # k3s default StorageClass. On the Hostinger box this is the root disk (no
  # separate volume), which is why the nightly backup below is not optional.
  storageClass: local-path

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Nightly logical backup to the host (prep-host.sh creates the dir). Copy it
# off-box (R2/B2) for a real backup — a dump on the same disk survives a bad
# migration or a dropped table, not a dead disk.
backup:
  enabled: true
  schedule: "30 3 * * *"
  hostPath: /opt/statusflow/backups
  retentionDays: 14

# Ubuntu 26.04 + k3s gives every container the stacked AppArmor label
# `cri-containerd.apparmor.d//&unconfined`, which containerd's default profile
# won't let signal itself — Postgres' startup process then dies with "could not
# signal for checkpoint: Permission denied" and the pod crash-loops. Use the
# host profile from deploy/vps/hostinger/apparmor/ (containerd's default + the
# stacked-peer signal rule; still enforcing). Merged into the chart's
# podSecurityContext, so it covers the StatefulSet and the backup Job. The
# profile must be loaded on the node (prep-host.sh) or the pod won't start.
podSecurityContext:
  appArmorProfile:
    type: Localhost
    localhostProfile: statusflow-default
