apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pg.fullname" . }}-init
  labels:
    {{- include "pg.labels" . | nindent 4 }}
data:
  # Runs once, at first boot, as the superuser against the freshly-created
  # POSTGRES_DB. It creates ONLY the restricted app_user; the superuser is the
  # privileged migration role and the schema itself is built by the migration
  # Job. Migration 001's `CREATE ROLE app_user … IF NOT EXISTS` then no-ops, so
  # the real password set here wins over the migration's dev default.
  #
  # psql does NOT interpolate :'vars' inside a dollar-quoted DO $$…$$ body, so
  # the conditional CREATE is built as a SELECT and run with \gexec (variables
  # stay outside any quoting). An earlier DO-block version failed with a syntax
  # error; the entrypoint then skipped init on restart and migration 001 created
  # app_user with its well-known dev password. The ALTER below makes the sealed
  # password authoritative even if the role somehow already exists.
  10-app-user.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=app_user="$APP_USER" \
      --set=app_password="$APP_USER_PASSWORD" \
      --set=app_db="$POSTGRES_DB" <<'EOSQL'
    SELECT format(
      'CREATE ROLE %I LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
      :'app_user')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
    ALTER ROLE :"app_user" WITH LOGIN PASSWORD :'app_password';
    GRANT CONNECT ON DATABASE :"app_db" TO :"app_user";
    EOSQL
