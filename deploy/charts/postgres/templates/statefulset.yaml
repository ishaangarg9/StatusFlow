apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pg.fullname" . }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pg.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "pg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pg.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.auth.superuser | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}
            - name: APP_USER
              value: {{ .Values.db.appUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: superuser-password
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: app-user-password
            # Keep PGDATA in a subdir so the PVC's lost+found never collides with
            # initdb's empty-dir check.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.auth.superuser }}", "-d", "{{ .Values.db.name }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          # startupProbe gives first-boot initdb + the init script time before
          # liveness can fire (otherwise a slow first boot trips a restart loop).
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.auth.superuser }}"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.auth.superuser }}"]
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: {{ include "pg.fullname" . }}-init
            # 0555: r-x for all. The postgres entrypoint runs *.sh from
            # /docker-entrypoint-initdb.d when executable (else sources them).
            defaultMode: 365
{{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
{{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
{{- end }}
