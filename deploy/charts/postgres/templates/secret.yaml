{{- if .Values.auth.create }}
# DEV / local-kind ONLY. In the cluster set auth.create=false and point
# auth.existingSecret at a Sealed Secret (P13) so passwords never live in Git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pg.secretName" . }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
type: Opaque
stringData:
  superuser-password: {{ .Values.auth.superuserPassword | quote }}
  app-user-password: {{ .Values.auth.appUserPassword | quote }}
{{- end }}
