{{- if .Values.db.secret.create }}
# DEV / local-kind ONLY. The RESTRICTED app_user DSN for api + worker. The
# privileged DSN is deliberately NOT here — it lives in the ephemeral migrate
# hook Secret (secret-migrate.yaml), mounted only on the migration Job.
# In the cluster: db.secret.create=false + a Sealed Secret carrying DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sf.dbSecretName" . }}
  labels:
    {{- include "sf.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "sf.appDSN" . | quote }}
{{- end }}
