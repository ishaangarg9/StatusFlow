apiVersion: v1
kind: Service
metadata:
  name: {{ include "sf.api.fullname" . }}
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
    # ops port is in-cluster only (scraping/probes); the Ingress never routes it.
    - name: ops
      port: {{ .Values.api.opsPort }}
      targetPort: ops
  selector:
    {{- include "sf.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
