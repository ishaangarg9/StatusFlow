{{- if .Values.migrate.secret.create }}
# Hook Secret holding ONLY the privileged (superuser) DSN, mounted solely on the
# migration Job — never on api/worker. Weight -10 so it exists before the Job
# (-5). before-hook-creation recreates it from current config on every deploy.
# (We deliberately do NOT use hook-succeeded here: a Secret has no completion to
# wait on, so Helm would delete it the instant it's created — before the Job
# could read it. It is overwritten each deploy and referenced only by the Job.)
# DEV / local-kind ONLY — in the cluster set migrate.secret.create=false and
# supply a pre-applied Sealed Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sf.migrateSecretName" . }}
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  MIGRATIONS_DATABASE_URL: {{ include "sf.migrateDSN" . | quote }}
{{- end }}