# Headless Service exposing only the worker's ops port for in-cluster scraping
# (P14 ServiceMonitor). The worker has no public/app port.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sf.worker.fullname" . }}
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: ops
      port: {{ .Values.worker.opsPort }}
      targetPort: ops
  selector:
    {{- include "sf.selectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
