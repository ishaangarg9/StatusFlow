{{- if .Values.secrets.create }}
# Sensitive app config. Empty values keep billing/email inert (Go config treats
# an empty STRIPE_SECRET_KEY/RESEND_API_KEY as "off"). In the cluster supply a
# Sealed Secret via secrets.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sf.appSecretName" . }}
  labels:
    {{- include "sf.labels" . | nindent 4 }}
type: Opaque
stringData:
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  STRIPE_PRICE_ID: {{ .Values.secrets.stripePriceId | quote }}
{{- end }}
