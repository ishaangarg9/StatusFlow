{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sf.serviceAccountName" . }}
  labels:
    {{- include "sf.labels" . | nindent 4 }}
# No RBAC bound: StatusFlow pods never talk to the k8s API. This SA exists only
# so the pods don't ride the namespace default; automounting the token is off.
automountServiceAccountToken: false
{{- end }}
