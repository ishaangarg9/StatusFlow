apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sf.api.fullname" . }}
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "sf.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sf.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Roll the pods when config/secret content changes (DSN or Stripe/Resend
        # key rotation must take effect on `helm upgrade`).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret-db: {{ include (print $.Template.BasePath "/secret-db.yaml") . | sha256sum }}
        checksum/secret-app: {{ include (print $.Template.BasePath "/secret-app.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sf.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "sf.image" (dict "root" . "img" .Values.images.api) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
            - name: ops
              containerPort: {{ .Values.api.opsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "sf.fullname" . }}-config
            - secretRef:
                name: {{ include "sf.appSecretName" . }}
          env:
            # app_user DSN only. The privileged DSN is never referenced here.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sf.dbSecretName" . }}
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
