name: Images

# Build + push the four images to GHCR once CI has passed on main, then commit
# the new immutable tag into deploy/prod/values-statusflow.yaml. That commit is
# the release: Argo CD (tracking main) sees it and syncs — PreSync migration Job,
# then api/worker/web roll, then the PostSync demo seed.
#
# Rollback = revert the bump commit (Argo syncs the previous tag back).
#
# The bump is pushed with GITHUB_TOKEN, which by design does not trigger other
# workflows, so it can't loop back into CI -> Images.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One release at a time; a newer run waits rather than racing the tag bump.
concurrency:
  group: images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ishaangarg9

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: api, file: Dockerfile.api, context: .}
          - {name: worker, file: Dockerfile.worker, context: .}
          - {name: migrate, file: Dockerfile.migrate, context: .}
          # Dockerfile.web's build context is web/, not the repo root.
          - {name: web, file: Dockerfile.web, context: web}
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve commit
        id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${sha:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ env.REGISTRY }}/statusflow-${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump image tags in prod values
        env:
          SHA: ${{ needs.build.outputs.sha }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          f=deploy/prod/values-statusflow.yaml
          current="$(grep -oE 'repository: statusflow-api, tag: [^}]+' "$f" | sed 's/.*tag: //' | tr -d ' ')"
          # Never move the release backwards: if a newer commit's images already
          # landed (a slower older run finishing late), skip.
          if [[ "$current" == sha-* ]] && ! git merge-base --is-ancestor "${current#sha-}" "$SHA" 2>/dev/null; then
            echo "current tag $current is not an ancestor of $SHA; not bumping"; exit 0
          fi
          sed -E -i "s/(repository: statusflow-(api|worker|web|migrate), tag: )[^}]+/\1${TAG}/" "$f"
          git diff --quiet && { echo "already at $TAG"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: images -> ${TAG}"
          # main may have moved while the images built; replay the bump on top.
          git pull --rebase origin main
          git push origin HEAD:main
