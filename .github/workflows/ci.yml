name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres so RLS is actually exercised (doc 07 §9).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statusflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # App connects as the RESTRICTED app_user (created by migration 001).
      DATABASE_URL: postgres://app_user:devpassword@localhost:5432/statusflow?sslmode=disable
      # Migrations run as the privileged role.
      MIGRATIONS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/statusflow?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Run migrations (privileged role)
        run: migrate -path internal/db/migrations -database "$MIGRATIONS_DATABASE_URL" up

      - name: Build
        run: go build ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

      # Vulnerability scan: govulncheck only fails on vulnerabilities in code
      # paths actually reachable from our binaries, so it's low-noise as a gate.
      # Pin the tool version (like staticcheck above) for reproducible runs.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
          govulncheck ./...

      # The authz gate: exhaustive permission matrix + no inline role checks
      # outside internal/authz/ (doc 07 §9.2 and §9.3). No DB needed.
      - name: Authz gate
        run: go test ./test/authz/...

      # Full suite, including the cross-tenant isolation proof and the
      # ownership-invariant regression, against real Postgres as app_user.
      - name: Test (with RLS, as app_user)
        run: go test ./...

  # Frontend gate: lint + typecheck + production build against the committed
  # pnpm lockfile (--frozen-lockfile makes the lockfile authoritative).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Match Dockerfile.web (Node 22) so CI lints/builds on the runtime
          # production ships.
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Advisory scan for production deps. Informational (continue-on-error): a
      # newly-published advisory fires on the feed's clock, not on this diff, so
      # blocking here would turn unrelated PRs red until someone bumps a dep.
      # Surfaces the signal in the run without gating the merge.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

  # Deploy gate: lint the charts and render them with prod values so a bad
  # values rename or template typo fails here rather than when Argo CD syncs.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint charts
        run: |
          helm lint deploy/charts/postgres
          helm lint deploy/charts/statusflow

      - name: Render with prod values
        run: |
          helm template pg deploy/charts/postgres -f deploy/prod/values-postgres.yaml > /dev/null
          helm template sf deploy/charts/statusflow -f deploy/prod/values-statusflow.yaml > /dev/null

      # Prod values must never inline a Secret (all secrets come from Sealed
      # Secrets via existingSecret). Fail the build if one appears.
      - name: Assert no inline Secrets in prod render
        run: |
          count="$(helm template sf deploy/charts/statusflow -f deploy/prod/values-statusflow.yaml | grep -c '^kind: Secret' || true)"
          if [ "$count" != "0" ]; then
            echo "prod statusflow render contains $count inline Secret(s); expected 0"; exit 1
          fi
